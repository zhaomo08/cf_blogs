backend:
  name: github
  repo: zhaomo08/cf_blogs
  branch: master
  base_url: https://cf-blogs-oauth.zhaomo0823.workers.dev
  auth_endpoint: auth

locale: zh_Hans
site_url: https://cf-blogs-4j9.pages.dev
display_url: https://cf-blogs-4j9.pages.dev
publish_mode: simple

media_folder: "public/images/uploads"
public_folder: "https://cf-blogs-r2.zhaomo0823.workers.dev/images/uploads"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    summary: "{{title}}"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "blog/{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布时间", name: "date", widget: "hidden", default: "" }
      - { label: "简要描述", name: "description", widget: "text", required: false, default: "", hint: "可选。用于首页摘要与 SEO 描述。" }
      - { label: "封面图片 URL", name: "cover", widget: "string", required: false, default: "", hint: "可选。填写后将作为文章顶部封面；留空则自动取正文第一张图片。" }
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "可添加多个标签，如：旅行、生活、技术"
        allow_add: true
        collapsed: false
      - { label: "草稿", name: "draft", widget: "hidden", default: false }
      - label: "正文（Markdown / 富文本）"
        name: "body"
        widget: "richtext"
        modes: ["rich_text", "raw"]
        hint: |
          地点会在保存时自动读取当前位置并写入地图数据（无需手动填写）。
          直接粘贴图片 URL 可显示；本地图片用右下角“上传图片到 R2”按钮。
          若未填写 cover，会自动使用正文第一张图片；若未填写简要描述，会自动取正文第一段。
