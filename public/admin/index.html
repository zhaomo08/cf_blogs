<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>博客管理后台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    .admin-tools {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      top: calc(72px + env(safe-area-inset-top));
      z-index: 2147483000;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .admin-tools button {
      border: 0;
      border-radius: 8px;
      background: #1f2937;
      color: #fff;
      font-size: 13px;
      padding: 10px 12px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }
    .admin-tools button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .upload-result-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(31, 41, 55, 0.38);
      backdrop-filter: blur(4px);
    }
    .upload-result-backdrop.is-open {
      display: flex;
    }
    .upload-result-dialog {
      width: min(720px, 100%);
      border: 1px solid #e6dfd4;
      border-radius: 14px;
      background: #fffdf9;
      box-shadow: 0 24px 80px rgba(31, 41, 55, 0.24);
      padding: 18px;
    }
    .upload-result-dialog h2 {
      margin: 0 0 6px;
      color: #1f2933;
      font-size: 18px;
      line-height: 1.35;
    }
    .upload-result-dialog p {
      margin: 0 0 14px;
      color: #716b61;
      font-size: 13px;
      line-height: 1.6;
    }
    .upload-result-grid {
      display: grid;
      gap: 12px;
    }
    .upload-result-field label {
      display: block;
      margin-bottom: 6px;
      color: #92400e;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .upload-result-field textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      border: 1px solid #ded6ca;
      border-radius: 10px;
      padding: 10px 12px;
      color: #1f2933;
      background: #ffffff;
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .upload-result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }
    .upload-result-actions button {
      border: 1px solid #ded6ca;
      border-radius: 8px;
      background: #ffffff;
      color: #1f2933;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 12px;
      cursor: pointer;
    }
    .upload-result-actions button[data-primary="true"] {
      border-color: #1f2937;
      background: #1f2937;
      color: #ffffff;
    }
    @media (max-width: 900px) {
      .admin-tools {
        top: auto;
        bottom: calc(12px + env(safe-area-inset-bottom));
      }
      .admin-tools button {
        font-size: 12px;
        padding: 9px 10px;
      }
    }
    @media (max-width: 720px) {
      .Toolbar__Toolbar___,
      [class*="Toolbar"] {
        flex-wrap: wrap !important;
      }
      [class*="Toolbar"] button {
        min-height: 36px;
        min-width: 36px;
      }
    }
    body {
      background:
        radial-gradient(circle at 12% 0%, rgba(180, 83, 9, 0.12), transparent 34rem),
        linear-gradient(180deg, #fbfaf7 0%, #f4efe7 100%);
      color: #1f2933;
    }
    #nc-root {
      max-width: 1640px;
      margin: 0 auto;
    }
    body.cf-blog-entry #nc-root {
      padding: 18px 20px 120px;
    }
    body.cf-blog-entry [data-cf-editor-shell="true"] {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px;
      align-items: start;
      max-width: 1360px;
      margin: 0 auto;
    }
    body.cf-blog-entry [data-cf-field] {
      min-width: 0;
      border-radius: 12px !important;
      border: 1px solid #e6dfd4 !important;
      background: rgba(255, 255, 255, 0.92) !important;
      box-shadow: 0 12px 34px rgba(50, 39, 23, 0.06) !important;
    }
    body.cf-blog-entry [data-cf-field="title"] {
      grid-column: 1;
      padding: 12px !important;
    }
    body.cf-blog-entry [data-cf-field="description"] {
      grid-column: 1;
      grid-row: 2;
      padding: 12px !important;
    }
    body.cf-blog-entry [data-cf-field="body"] {
      grid-column: 1;
      grid-row: 3;
      min-height: 62vh;
      padding: 12px !important;

    body.cf-blog-entry [data-cf-field="tags"],
    body.cf-blog-entry [data-cf-field="cover"],
    body.cf-blog-entry [data-cf-field="draft"] {
      grid-column: 2;

    body.cf-blog-entry [data-cf-field="cover"] {

    }
    body.cf-blog-entry [data-cf-field="date"] {

    body.cf-blog-entry [data-cf-field="title"] input {

    body.cf-blog-entry [data-cf-field="body"] textarea {

      font-size: 16px !important;

    body.cf-blog-entry [data-cf-field="description"] input,
    body.cf-blog-entry [data-cf-field="description"] textarea {

    body.cf-blog-entry [data-cf-field="cover"] input,
    body.cf-blog-entry [data-cf-field="tags"] input {

    body.cf-blog-entry [data-cf-field="title"]::before,
    body.cf-blog-entry [data-cf-field="body"]::before,
    body.cf-blog-entry [data-cf-field="description"]::before,
    body.cf-blog-entry [data-cf-field="tags"]::before,
    body.cf-blog-entry [data-cf-field="cover"]::before {
      display: block;

      color: #92400e;

    }
    body.cf-blog-entry [data-cf-field="title"]::before { content: "Title"; }
    body.cf-blog-entry [data-cf-field="body"]::before { content: "Markdown Editor"; }
    body.cf-blog-entry [data-cf-field="description"]::before { content: "Description"; }
    body.cf-blog-entry [data-cf-field="tags"]::before { content: "Tags"; }
    body.cf-blog-entry [data-cf-field="cover"]::before { content: "Cover"; }
    body.cf-blog-entry .cf-cover-preview {
      display: none;
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid #ded6ca;
      border-radius: 10px;
      background: #f8f4ed;
    }
    body.cf-blog-entry .cf-cover-preview.is-visible {
      display: block;
    }
    body.cf-blog-entry .cf-cover-preview img {
      width: 100%;
      max-height: 180px;
      display: block;
      object-fit: cover;
      background: #f3eee6;
    }
    body.cf-blog-entry .cf-cover-preview span {
      display: block;
      padding: 8px 10px;
      color: #716b61;
      font-size: 12px;
      line-height: 1.45;
    }
    body.cf-blog-entry .cf-autosave-status {
      grid-column: 1 / -1;
      color: #716b61;
      font-size: 12px;
      line-height: 1.5;
      text-align: right;
    }
    body.cf-blog-entry .cf-editor-tip {
      grid-column: 1;
      margin-top: -6px;
      color: #716b61;
      font-size: 13px;

    #nc-root [class*="EditorControlPane"] {
      padding-bottom: 110px;
    }
    #nc-root [class*="EditorControlPane"] [class*="ControlPaneContainer"] {
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
      padding: 14px;
    }
    #nc-root input[type="text"],
    #nc-root textarea,
    #nc-root input[type="datetime-local"],
    #nc-root input[type="url"] {
      border-radius: 10px !important;
    }
    #nc-root [role="textbox"] {
      min-height: min(62vh, 760px);
    }
    #nc-root textarea {
      min-height: 84px !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace !important;
      line-height: 1.7 !important;
    }
    @media (max-width: 960px) {
      body.cf-blog-entry #nc-root {
        padding: 10px 10px 96px;
      }
      body.cf-blog-entry [data-cf-editor-shell="true"] {
        display: block !important;
      }
      body.cf-blog-entry [data-cf-field] {
        margin-bottom: 12px !important;
        padding: 12px !important;
      }
      #nc-root [class*="EditorControlPane"] {
        padding-bottom: 92px;
      }
      #nc-root [role="textbox"] {
        min-height: min(52vh, 620px);
      }
      #nc-root textarea {
        min-height: 84px !important;
      }
    }
  </style>

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle("/admin/preview.css");
  </script>

  <div class="admin-tools">
    <button id="btn-r2-upload" type="button">上传图片到 R2</button>
  </div>

  <div class="upload-result-backdrop" id="upload-result" aria-hidden="true">
    <div class="upload-result-dialog" role="dialog" aria-modal="true" aria-labelledby="upload-result-title">
      <h2 id="upload-result-title">图片已上传到 R2</h2>
      <p>封面图一般复制 URL 填到“封面图片 URL”；正文图片复制 Markdown 放到正文里。</p>
      <div class="upload-result-grid">
        <div class="upload-result-field">
          <label for="upload-url">图片 URL（用于封面）</label>
          <textarea id="upload-url" readonly></textarea>
        </div>
        <div class="upload-result-field">
          <label for="upload-markdown">Markdown（用于正文）</label>
          <textarea id="upload-markdown" readonly></textarea>
        </div>
      </div>
      <div class="upload-result-actions">
        <button type="button" data-copy-target="upload-url">复制 URL</button>
        <button type="button" data-copy-target="upload-markdown" data-primary="true">复制 Markdown</button>
        <button type="button" id="insert-upload-markdown">插入正文</button>
        <button type="button" id="close-upload-result">关闭</button>
      </div>
    </div>
  </div>

  <script>
    window.R2_UPLOAD_ENDPOINT = "https://cf-blogs-r2.zhaomo0823.workers.dev/upload";
  </script>

  <script>
    (function () {
      const LOCATION_CACHE_KEY = "cf_blogs_auto_location_v1";
      const ENTRY_DRAFT_PREFIX = "cf_blogs_entry_draft_v2:";
      const CMS_AUTH_STORAGE_KEYS = ["netlify-cms-user", "decap-cms-user"];
      let currentAutoLocation = null;
      let baseViewportHeight = 0;

      function isVisible(node) {
        if (!node) return false;
        const style = window.getComputedStyle(node);
        return style.display !== "none" && style.visibility !== "hidden";
      }

      function findEditorTarget() {
        const active = document.activeElement;
        if (
          active &&
          isVisible(active) &&
          (active.tagName === "TEXTAREA" || active.isContentEditable || active.getAttribute("role") === "textbox")
        ) {
          return active;
        }

        const candidates = Array.from(
          document.querySelectorAll("textarea, [contenteditable='true'], [role='textbox']")
        ).filter(isVisible);

        return candidates.length ? candidates[candidates.length - 1] : null;
      }

      function insertIntoTextarea(textarea, text) {
        const start = textarea.selectionStart || 0;
        const end = textarea.selectionEnd || 0;
        const value = textarea.value || "";
        const next = value.slice(0, start) + text + value.slice(end);
        textarea.value = next;
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
        const pos = start + text.length;
        textarea.setSelectionRange(pos, pos);
        textarea.focus();
        return true;
      }

      function insertIntoContentEditable(el, text) {
        el.focus();
        if (document.execCommand) {
          const ok = document.execCommand("insertText", false, text);
          if (ok) {
            el.dispatchEvent(new Event("input", { bubbles: true }));
            return true;
          }
        }
        el.textContent = (el.textContent || "") + text;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        return true;
      }

      function insertMarkdownToEditor(markdown) {
        const target = findEditorTarget();
        if (!target) return false;
        const text = "\n" + markdown + "\n";

        if (target.tagName === "TEXTAREA") {
          return insertIntoTextarea(target, text);
        }
        return insertIntoContentEditable(target, text);
      }

      function readCmsAuthToken() {
        const keys = [...CMS_AUTH_STORAGE_KEYS];
        try {
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (!key) continue;
            const lower = key.toLowerCase();
            if (lower.includes("cms") || lower.includes("decap") || lower.includes("netlify")) {
              keys.push(key);
            }
          }
        } catch (_) {}

        for (const key of keys) {
          let raw = null;
          try {
            raw = localStorage.getItem(key);
          } catch (_) {
            raw = null;
          }
          if (!raw) continue;

          try {
            const parsed = JSON.parse(raw);
            const candidates = [
              parsed?.token,
              parsed?.access_token,
              parsed?.user?.token,
              parsed?.user?.access_token,
              parsed?.backend?.token,
              parsed?.github?.token,
            ];
            for (const candidate of candidates) {
              if (typeof candidate === "string" && candidate.trim()) {
                return candidate.trim();
              }
            }
          } catch (_) {}
        }
        return "";
      }

      async function uploadToR2(file) {
        const githubToken = readCmsAuthToken();
        if (!githubToken) {
          throw new Error("未检测到 CMS 登录态，请先刷新页面并重新登录后台后再上传。");
        }
        const form = new FormData();
        form.append("file", file);
        const resp = await fetch(window.R2_UPLOAD_ENDPOINT, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${githubToken}`,
          },
          body: form,
        });
        if (!resp.ok) {
          let detail = "";
          try {
            const payload = await resp.json();
            detail = payload?.error ? `: ${payload.error}` : "";
          } catch (_) {}
          throw new Error(`Upload failed (${resp.status})${detail}`);
        }
        return resp.json();
      }

      function pickFile() {
        return new Promise((resolve) => {
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/*";
          input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
          input.click();
        });
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          window.prompt("复制失败，请手动复制：", text);
          return false;
        }
      }

      function showUploadResult({ url, markdown }) {
        const modal = document.getElementById("upload-result");
        const urlField = document.getElementById("upload-url");
        const markdownField = document.getElementById("upload-markdown");
        if (!modal || !urlField || !markdownField) return;

        urlField.value = url;
        markdownField.value = markdown;
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        markdownField.focus();
        markdownField.select();
      }

      function closeUploadResult() {
        const modal = document.getElementById("upload-result");
        if (!modal) return;
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
      }

      async function handleR2Upload() {
        const btn = document.getElementById("btn-r2-upload");
        try {
          btn.disabled = true;
          btn.textContent = "上传中...";
          const file = await pickFile();
          if (!file) return;
          const payload = await uploadToR2(file);
          if (!payload || !payload.url) throw new Error("Missing url");

          const markdown = `![${file.name}](${payload.url})`;
          showUploadResult({ url: payload.url, markdown });
        } catch (err) {
          const msg = err && err.message ? err.message : String(err);
          alert("上传失败: " + msg);
        } finally {
          btn.disabled = false;
          btn.textContent = "上传图片到 R2";
        }
      }

      function setupUploadResultActions() {
        const modal = document.getElementById("upload-result");
        if (!modal) return;

        modal.addEventListener("click", (event) => {
          if (event.target === modal) closeUploadResult();
        });
        document.getElementById("close-upload-result")?.addEventListener("click", closeUploadResult);
        document.getElementById("insert-upload-markdown")?.addEventListener("click", () => {
          const markdown = document.getElementById("upload-markdown")?.value || "";
          if (markdown && insertMarkdownToEditor(markdown)) {
            closeUploadResult();
          } else if (markdown) {
            window.prompt("未找到正文编辑器，请手动复制：", markdown);
          }
        });
        Array.from(document.querySelectorAll("[data-copy-target]")).forEach((button) => {
          button.addEventListener("click", async () => {
            const targetId = button.getAttribute("data-copy-target");
            const target = targetId ? document.getElementById(targetId) : null;
            const text = target && "value" in target ? target.value : "";
            if (!text) return;
            const copied = await copyText(text);
            if (!copied) return;
            const oldText = button.textContent;
            button.textContent = "已复制";
            setTimeout(() => {
              button.textContent = oldText;
            }, 1200);
          });
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeUploadResult();
        });
      }

      function parseCommentMetaBlock(body) {
        const source = String(body || "");
        const match = source.match(/^\s*<!--\s*meta\s*([\s\S]*?)-->\s*/i);
        if (!match) {
          return { body: source, cover: "" };
        }

        const metaText = match[1] || "";
        const nextBody = source.replace(match[0], "");
        let cover = "";

        metaText.split(/\r?\n/).forEach((line) => {
          const item = line.trim();
          if (!item) return;

          const kv = item.match(/^([a-zA-Z_]+)\s*:\s*(.+)$/);
          if (!kv) return;
          const key = kv[1].toLowerCase();
          const value = kv[2].trim();

          if (key === "cover" || key === "image") {
            cover = value;
          }
        });

        return { body: nextBody, cover };
      }

      function parseInlineMetaSyntax(body) {
        const source = String(body || "");
        const lines = source.split(/\r?\n/);
        let idx = 0;
        while (idx < lines.length && !lines[idx].trim()) idx += 1;

        let cover = "";
        let consumedUntil = idx;
        let hasMeta = false;

        const coverMatch = lines[idx] && lines[idx].trim().match(/^(?:cover|封面)\s*:\s*(https?:\/\/\S+)\s*$/i);
        if (coverMatch) {
          cover = coverMatch[1].trim();
          consumedUntil = idx + 1;
          hasMeta = true;
        }

        if (!hasMeta) {
          return { body: source, cover: "" };
        }

        const bodyLines = lines.slice(consumedUntil);
        const cleanedBody = bodyLines.join("\n").replace(/^\s+/, "");
        return { body: cleanedBody, cover };
      }

      function extractFirstMarkdownImage(body) {
        const source = String(body || "");
        const mdMatch = source.match(/!\[[^\]]*]\((https?:\/\/[^)\s]+)\)/i);
        if (mdMatch && mdMatch[1]) return mdMatch[1].trim();
        const htmlMatch = source.match(/<img[^>]+src=["'](https?:\/\/[^"']+)["']/i);
        if (htmlMatch && htmlMatch[1]) return htmlMatch[1].trim();
        return "";
      }

      function normalizeCoverUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        try {
          const url = new URL(text);
          if (url.protocol === "http:" || url.protocol === "https:") {
            return url.toString();
          }
          return "";
        } catch (_) {
          return "";
        }
      }

      function extractFirstParagraph(body) {
        const source = String(body || "")
          .replace(/!\[[^\]]*]\((?:[^)]+)\)/g, " ")
          .replace(/<img[^>]*>/gi, " ")
          .replace(/```[\s\S]*?```/g, " ")
          .replace(/`[^`]+`/g, " ")
          .replace(/^#+\s+/gm, "")
          .replace(/^\s*[-*]\s+/gm, "")
          .replace(/^\s*\d+\.\s+/gm, "");

        const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        const first = lines.find((line) => line.length > 6) || "";
        if (!first) return "";
        return first.length > 140 ? `${first.slice(0, 137)}...` : first;
      }

      function parseBodyMeta(body) {
        const fromComment = parseCommentMetaBlock(body);
        const fromInline = parseInlineMetaSyntax(fromComment.body);
        const finalBody = fromInline.body;
        return {
          body: finalBody,
          cover: normalizeCoverUrl(fromInline.cover || fromComment.cover || extractFirstMarkdownImage(finalBody)),
        };
      }

      function normalizeLocationValue(raw) {
        if (!raw) return null;
        let value = raw;
        if (value && typeof value === "object" && typeof value.toJS === "function") {
          value = value.toJS();
        }
        if (!value || typeof value !== "object") return null;

        const lat = Number(value.lat);
        const lng = Number(value.lng);
        const name = String(value.name || "").trim();
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || !name) return null;

        return {
          name,
          lat: Number(lat.toFixed(6)),
          lng: Number(lng.toFixed(6)),
        };
      }

      function saveLocationCache(location) {
        try {
          localStorage.setItem(LOCATION_CACHE_KEY, JSON.stringify(location));
        } catch (_) {}
      }

      function readLocationCache() {
        try {
          const raw = localStorage.getItem(LOCATION_CACHE_KEY);
          if (!raw) return null;
          return normalizeLocationValue(JSON.parse(raw));
        } catch (_) {
          return null;
        }
      }

      function getCurrentPositionAsync() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation API unavailable"));
            return;
          }
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 10 * 60 * 1000,
          });
        });
      }

      async function reverseGeocode(lat, lng) {
        const endpoint = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
        const resp = await fetch(endpoint, { headers: { Accept: "application/json" } });
        if (!resp.ok) throw new Error("Reverse geocode failed");
        const data = await resp.json();
        const fallback = `${lat}, ${lng}`;
        return String(data.display_name || fallback).trim() || fallback;
      }

      async function refreshAutoLocation() {
        try {
          const pos = await getCurrentPositionAsync();
          const lat = Number(pos.coords.latitude.toFixed(6));
          const lng = Number(pos.coords.longitude.toFixed(6));
          let name = `${lat}, ${lng}`;
          try {
            name = await reverseGeocode(lat, lng);
          } catch (_) {}
          const location = normalizeLocationValue({ name, lat, lng });
          if (!location) return null;
          currentAutoLocation = location;
          saveLocationCache(location);
          return location;
        } catch (_) {
          return null;
        }
      }

      function normalizeTagsValue(raw) {
        let value = raw;
        if (value && typeof value === "object" && typeof value.toJS === "function") {
          value = value.toJS();
        }

        const source = Array.isArray(value) ? value : [value];
        const tags = [];
        source.forEach((item) => {
          String(item || "")
            .replace(/\]\[/g, "、")
            .split(/[、,，;；]+/)
            .map((tag) => tag.trim().replace(/^#+/, "").trim())
            .filter(Boolean)
            .forEach((tag) => {
              if (!tags.includes(tag)) tags.push(tag);
            });
        });
        return tags;
      }

      function simplifyChrome() {
        const navLinks = Array.from(document.querySelectorAll("a, button, span"));
        navLinks.forEach((el) => {
          const text = (el.textContent || "").trim().toLowerCase();
          if (text === "工作流" || text === "workflow" || text === "媒体" || text === "media") {
            const node = el.closest("a,button,li,div") || el;
            node.style.display = "none";
          }
        });
      }

      function setupAutoLocation() {
        currentAutoLocation = readLocationCache();
        refreshAutoLocation();

        const touchHandler = () => {
          refreshAutoLocation();
          window.removeEventListener("pointerdown", touchHandler);
        };
        window.addEventListener("pointerdown", touchHandler, { once: true });
      }

      function setupMobileToolVisibility() {
        const tools = document.querySelector(".admin-tools");
        if (!tools) return;

        const viewport = window.visualViewport;
        const update = () => {
          const currentHeight = viewport ? viewport.height : window.innerHeight;
          if (!baseViewportHeight) {
            baseViewportHeight = currentHeight;
          }
          const keyboardOffset = Math.max(0, baseViewportHeight - currentHeight);
          tools.style.opacity = "1";
          tools.style.pointerEvents = "auto";
          tools.style.transform = keyboardOffset > 80 ? `translateY(-${Math.min(keyboardOffset, 320)}px)` : "translateY(0)";
        };

        update();
        window.addEventListener("resize", update);
        if (viewport) viewport.addEventListener("resize", update);
      }

      function setupEditorLayoutEnhancements() {
        const FIELD_LABELS = [
          { key: "title", labels: ["标题"] },
          { key: "body", labels: ["正文（Markdown）", "正文"] },
          { key: "description", labels: ["简要描述"] },
          { key: "tags", labels: ["标签"] },
          { key: "cover", labels: ["封面图片 URL", "封面"] },
          { key: "draft", labels: ["草稿"] },
        ];

        function isEntryPage() {
          return /#\/collections\/blog\/(new|entries\/)/.test(window.location.hash || "");
        }

        function compactText(value) {
          return String(value || "").replace(/\s+/g, " ").trim();
        }

        function findLabelNode(labels) {
          const nodes = Array.from(document.querySelectorAll("#nc-root label, #nc-root span, #nc-root div, #nc-root p"));
          return nodes.find((node) => {
            const text = compactText(node.textContent);
            return text.length > 0 && text.length < 80 && labels.some((label) => text.includes(label));
          });
        }

        function findFieldShell(labelNode) {
          let node = labelNode;
          for (let depth = 0; node && depth < 9; depth += 1) {
            if (node.id === "nc-root") break;
            if (node.querySelector && node.querySelector("input, textarea, [contenteditable='true'], [role='textbox']")) {
              return node;
            }
            node = node.parentElement;
          }
          return null;
        }

        function findCommonShell(fields) {
          const candidates = fields
            .filter(Boolean)
            .map((field) => {
              const chain = [];
              let node = field.parentElement;
              while (node && node.id !== "nc-root") {
                chain.push(node);
                node = node.parentElement;
              }
              return chain;
            });
          if (!candidates.length) return null;

          const titleChain = candidates[0];
          return titleChain.find((candidate) => {
            const count = fields.filter((field) => field && candidate.contains(field)).length;
            return count >= Math.min(fields.length, 4);
          }) || null;
        }

        function getDraftKey() {
          const hash = window.location.hash || "#/";
          return ENTRY_DRAFT_PREFIX + encodeURIComponent(hash);
        }

        function getControl(field) {
          if (!field) return null;
          const controls = Array.from(
            field.querySelectorAll("textarea, input[type='text'], input[type='url'], input[type='search'], input:not([type]), [contenteditable='true'], [role='textbox']")
          ).filter(isVisible);
          return controls.length ? controls[controls.length - 1] : null;
        }

        function readControlValue(control) {
          if (!control) return "";
          if (control.isContentEditable) return control.textContent || "";
          if ("value" in control) return control.value || "";
          return "";
        }

        function setControlValue(control, value) {
          if (!control) return;
          const nextValue = String(value || "");
          if (control.isContentEditable) {
            control.textContent = nextValue;
          } else if ("value" in control) {
            const proto = control instanceof HTMLTextAreaElement
              ? HTMLTextAreaElement.prototype
              : HTMLInputElement.prototype;
            const setter = Object.getOwnPropertyDescriptor(proto, "value")?.set;
            if (setter) setter.call(control, nextValue);
            else control.value = nextValue;
          }
          control.dispatchEvent(new Event("input", { bubbles: true }));
          control.dispatchEvent(new Event("change", { bubbles: true }));
        }

        function readDraft() {
          try {
            const raw = localStorage.getItem(getDraftKey());
            return raw ? JSON.parse(raw) : null;
          } catch (_) {
            return null;
          }
        }

        function writeDraft(values) {
          try {
            localStorage.setItem(getDraftKey(), JSON.stringify({ values, updatedAt: Date.now() }));
          } catch (_) {}
        }

        function clearDraft() {
          try {
            localStorage.removeItem(getDraftKey());
          } catch (_) {}
        }

        function formatDraftTime(timestamp) {
          if (!timestamp) return "";
          try {
            return new Date(timestamp).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
          } catch (_) {
            return "";
          }
        }

        function setStatus(commonShell, text) {
          if (!commonShell) return;
          let status = commonShell.querySelector(".cf-autosave-status");
          if (!status) {
            status = document.createElement("div");
            status.className = "cf-autosave-status";
            commonShell.appendChild(status);
          }
          status.textContent = text;
        }

        function setupCoverPreview(coverField) {
          if (!coverField || coverField.dataset.cfPreviewReady === "true") return;
          const input = getControl(coverField);
          if (!input) return;

          coverField.dataset.cfPreviewReady = "true";
          const preview = document.createElement("div");
          preview.className = "cf-cover-preview";
          preview.innerHTML = "<img alt=\"封面预览\" loading=\"lazy\" decoding=\"async\" /><span>封面预览</span>";
          coverField.appendChild(preview);
          const img = preview.querySelector("img");
          const caption = preview.querySelector("span");

          function update() {
            const value = readControlValue(input).trim();
            const valid = /^https?:\/\/\S+$/i.test(value);
            preview.classList.toggle("is-visible", valid);
            if (!valid) {
              img.removeAttribute("src");
              return;
            }
            img.src = value;
            caption.textContent = "封面预览";
          }

          img.addEventListener("error", () => {
            caption.textContent = "图片暂时无法预览，但链接仍会保存。";
          });
          input.addEventListener("input", update);
          input.addEventListener("change", update);
          update();
        }

        function setupEntryAutosave(fieldMap, commonShell) {
          if (!commonShell || commonShell.dataset.cfAutosaveReady === "true") return;
          commonShell.dataset.cfAutosaveReady = "true";

          const keys = ["title", "description", "body", "tags", "cover"];
          const controls = {};
          keys.forEach((key) => {
            controls[key] = getControl(fieldMap[key]);
          });

          const draft = readDraft();
          if (draft && draft.values) {
            keys.forEach((key) => {
              if (controls[key] && typeof draft.values[key] === "string") {
                setControlValue(controls[key], draft.values[key]);
              }
            });
            setStatus(commonShell, `已恢复本地草稿 ${formatDraftTime(draft.updatedAt)}`);
          } else {
            setStatus(commonShell, "本地自动保存已开启，刷新页面不会丢失未发布内容。");
          }

          let timer = null;
          function collect() {
            const values = {};
            keys.forEach((key) => {
              values[key] = readControlValue(controls[key]);
            });
            return values;
          }

          function scheduleSave() {
            window.clearTimeout(timer);
            timer = window.setTimeout(() => {
              writeDraft(collect());
              setStatus(commonShell, `已自动保存 ${formatDraftTime(Date.now())}`);
            }, 350);
          }

          keys.forEach((key) => {
            const control = controls[key];
            if (!control) return;
            control.addEventListener("input", scheduleSave);
            control.addEventListener("change", scheduleSave);
          });

          window.addEventListener("beforeunload", () => {
            writeDraft(collect());
          });
        }

        function applyLayout() {
          document.body.classList.toggle("cf-blog-entry", isEntryPage());
          if (!isEntryPage()) return;

          const fields = [];
          const fieldMap = {};
          FIELD_LABELS.forEach(({ key, labels }) => {
            const labelNode = findLabelNode(labels);
            const shell = labelNode ? findFieldShell(labelNode) : null;
            if (!shell) return;
            shell.setAttribute("data-cf-field", key);
            fields.push(shell);
            fieldMap[key] = shell;
          });

          const commonShell = findCommonShell(fields);
          if (commonShell) {
            commonShell.setAttribute("data-cf-editor-shell", "true");
          }

          const bodyField = fields.find((field) => field.getAttribute("data-cf-field") === "body");
          if (bodyField && commonShell && !commonShell.querySelector(".cf-editor-tip")) {
            const tip = document.createElement("div");
            tip.className = "cf-editor-tip";
            tip.textContent = "写作区保持纯 Markdown：图片用 ![描述](URL)；摘要在标题下方填写，封面和标签在右侧填写；发布时间会在保存/发布时自动使用当前时间。";
            commonShell.insertBefore(tip, bodyField.nextSibling);
          }

          setupCoverPreview(fieldMap.cover);
          setupEntryAutosave(fieldMap, commonShell);
        }

        const observer = new MutationObserver(() => {
          window.requestAnimationFrame(applyLayout);
        });
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener("hashchange", applyLayout);
        applyLayout();
      }

      CMS.registerEventListener({
        name: "preSave",
        handler: ({ entry }) => {
          const data = entry.get("data");
          const body = data.get("body") || "";
          const parsed = parseBodyMeta(body);

          let next = data.set("body", parsed.body);
          next = next.set("date", new Date().toISOString());
          const normalizedTags = normalizeTagsValue(data.get("tags"));
          const nextTags = window.Immutable && window.Immutable.fromJS
            ? window.Immutable.fromJS(normalizedTags)
            : normalizedTags;
          next = next.set("tags", nextTags);

          const existingDescription = String(data.get("description") || "").trim();
          if (!existingDescription) {
            const fallbackDescription = extractFirstParagraph(parsed.body);
            if (fallbackDescription) {
              next = next.set("description", fallbackDescription);
            }
          }

          if (parsed.cover) {
            next = next.set("cover", parsed.cover);
          }

          const existingLocation = normalizeLocationValue(data.get("location"));
          const autoLocation = currentAutoLocation || readLocationCache();
          if (existingLocation) {
            const immutableLocation = window.Immutable && window.Immutable.fromJS
              ? window.Immutable.fromJS(existingLocation)
              : existingLocation;
            next = next.set("location", immutableLocation);
          } else if (autoLocation) {
            const immutableLocation = window.Immutable && window.Immutable.fromJS
              ? window.Immutable.fromJS(autoLocation)
              : autoLocation;
            next = next.set("location", immutableLocation);
          } else {
            next = next.delete("location");
          }

          return next;
        },
      });
      CMS.registerEventListener({
        name: "postSave",
        handler: () => {
          try {
            localStorage.removeItem(ENTRY_DRAFT_PREFIX + encodeURIComponent(window.location.hash || "#/"));
            localStorage.removeItem(ENTRY_DRAFT_PREFIX + encodeURIComponent("#/collections/blog/new"));
          } catch (_) {}
        },
      });

      setupAutoLocation();
      setupMobileToolVisibility();
      setupEditorLayoutEnhancements();
      setupUploadResultActions();
      document.getElementById("btn-r2-upload").addEventListener("click", handleR2Upload);
      setInterval(simplifyChrome, 800);
    })();
  </script>
</body>
</html>
